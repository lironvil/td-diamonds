<style>
/* VOICE: quiet, formal showroom welcome — few hues, fine detail, air
   IDEA: the stationery card a fine jeweller hands a client
   PICTURE: the TD logo above one calm column of large fields
   COLOUR/TYPE: white, ink, logo gold #b3ab6a; Cormorant Garamond titles, Jost fields
   LAYOUT: centred card ≤640px, iPad portrait and landscape, no scrolling clutter */
:root{color-scheme:light;--bg:#fff;--ink:#141414;--mute:#6b6b6b;--line:#d9d6c7;--gold:#b3ab6a;--gold2:#8f8848;--err:#a3261b;--field:#fbfaf6}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Jost,system-ui,-apple-system,sans-serif;overflow-x:clip;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:640px;margin:0 auto;padding:clamp(20px,4vh,48px) 24px 48px}
.brand{display:block;width:clamp(150px,24vw,210px);margin:0 auto 8px}
h1{font:600 clamp(32px,4.4vw,42px)/1.08 "Cormorant Garamond",Georgia,serif;text-align:center;margin:12px 0 6px;letter-spacing:.01em;text-wrap:balance}
.sub{text-align:center;color:var(--mute);margin:0 0 28px}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:0 auto 28px;width:70%}
form{display:grid;gap:18px}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.row3{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1.2fr);gap:16px}
@media(max-width:560px){.row,.row3{grid-template-columns:minmax(0,1fr)}}
label{display:block;font-size:15px;color:var(--mute);margin:0 0 6px}
label b{color:var(--gold2);font-weight:500}
input{width:100%;font:inherit;font-size:20px;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-height:56px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(179,171,106,.22);background:#fff}
input[aria-invalid=true]{border-color:var(--err)}
.hint{font-size:14px;color:var(--err);margin:6px 2px 0;min-height:0}
.ac{position:relative}
.list{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(20,20,20,.14);list-style:none;margin:0;padding:6px;z-index:5;max-height:380px;overflow:auto}
.list[hidden]{display:none}
.list li{padding:12px 14px;border-radius:8px;cursor:pointer;min-height:52px}
.list li .m{font-size:18px;color:var(--ink)}
.list li .s{font-size:14px;color:var(--mute)}
.list li[aria-selected=true],.list li:active{background:#f4f2e6}
.list .foot{font-size:12px;color:var(--mute);text-align:right;padding:4px 10px 2px;cursor:default;min-height:0}
.list .foot:active{background:none}
button{font:500 20px/1 Jost,system-ui,sans-serif;letter-spacing:.06em;color:#fff;background:var(--ink);border:0;border-radius:12px;min-height:64px;padding:0 24px;margin-top:8px;cursor:pointer;transition:background .15s,transform .1s}
button:active{transform:scale(.99);background:#000}
button:disabled{opacity:.55}
button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.note{font-size:13px;color:var(--mute);text-align:center;margin:6px 0 0}
.err{color:var(--err);text-align:center;font-size:15px;margin:0}
.done{display:none;text-align:center;padding-top:6vh}
.done.on{display:block}
.done h1{font-size:clamp(38px,5vw,52px)}
.gem{width:64px;height:64px;margin:18px auto 10px;display:block;animation:pop .5s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.gem{animation:none}}
.hide{display:none}
.staff{display:flex;align-items:center;gap:10px;border:1px dashed #cfc9ad;border-radius:12px;padding:8px 10px;margin:6px 0 20px;background:#fcfbf6}
.staff .sl{font-size:13px;color:var(--gold2);white-space:nowrap;padding-left:4px}
.staff input{min-height:46px;font-size:17px;padding:8px 12px;flex:1}
.staff .thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;border:1px solid var(--line);flex:none;cursor:pointer}
button.cam{flex:none;margin:0;min-height:46px;padding:0 14px;font-size:15px;letter-spacing:0;background:#fff;color:var(--ink);border:1px solid var(--line);display:flex;align-items:center;gap:6px}
button.cam:active{background:#f4f2e6}
button.cam svg{width:20px;height:20px}
.modal{position:fixed;inset:0;z-index:30;background:rgba(15,15,15,.96);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.modal[hidden]{display:none}
.modal p{color:#fff;font-size:20px;margin:0}
.modal img{max-width:100%;max-height:68vh;border-radius:12px;background:#fff}
.modal .btns{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.modal button{margin:0;min-width:190px}
.modal button.ghost{background:#fff;color:var(--ink)}
@media(max-width:560px){.staff{flex-wrap:wrap}.staff input{flex-basis:100%}}
</style>
</head>

<script>
{
const CONFIG = {
  GOOGLE_KEY: "AIzaSyAANFm0adq1rSJqU6bgDQDTrCEWRn0yg14",
  SUPABASE_URL: "https://oebqonzayfxfzvlvjgpv.supabase.co",
  SUPABASE_KEY: "sb_publishable_SlLP9Nj2LmMrdMVZWkUyVQ_KJhKI2J4",
  BIAS: {lat: 40.7570, lng: -73.9800, radius: 50000}, // NYC first, then all of US
  RESET_AFTER_SAVE_MS: 5000,
  IDLE_RESET_MS: 120000
};
const $ = id => document.getElementById(id);
const F = {first:$("first"), last:$("last"), phone:$("phone"), email:$("email"), addr:$("addr"), unit:$("unit"), zip:$("zip"), state:$("state"), city:$("city")};
const list = $("sug"), errEl = $("err"), hintEl = $("hint"), go = $("go");
let placeId = null, places = null, token = null, items = [], active = -1, seq = 0, timer = 0;

/* ---------- phone formatting ---------- */
F.phone.addEventListener("input", () => {
  const v = F.phone.value;
  if (v.trim().startsWith("+") && !v.trim().startsWith("+1")) return; // international: leave as typed
  let d = v.replace(/\D/g, "");
  if (d.length === 11 && d[0] === "1") d = d.slice(1);
  d = d.slice(0, 10);
  F.phone.value = d.length > 6 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : d.length > 3 ? `(${d.slice(0,3)}) ${d.slice(3)}` : d;
});

/* ---------- Google address suggestions ---------- */
function loadGoogle() {
  if (!CONFIG.GOOGLE_KEY || CONFIG.GOOGLE_KEY.startsWith("__")) return;
  // Google's official dynamic loader
  (g=>{var h,a,k,p="The Google Maps JavaScript API",c="google",l="importLibrary",q="__ib__",m=document,b=window;b=b[c]||(b[c]={});var d=b.maps||(b.maps={}),r=new Set,e=new URLSearchParams,u=()=>h||(h=new Promise(async(f,n)=>{await (a=m.createElement("script"));e.set("libraries",[...r]+"");for(k in g)e.set(k.replace(/[A-Z]/g,t=>"_"+t[0].toLowerCase()),g[k]);e.set("callback",c+".maps."+q);a.src=`https://maps.${c}apis.com/maps/api/js?`+e;d[q]=f;a.onerror=()=>h=n(Error(p+" could not load."));a.nonce=m.querySelector("script[nonce]")?.nonce||"";m.head.append(a)}));d[l]?console.warn(p+" only loads once. Ignoring:",g):d[l]=(f,...n)=>r.add(f)&&u().then(()=>d[l](f,...n))})({key: CONFIG.GOOGLE_KEY, v: "weekly"});
  google.maps.importLibrary("places").then(lib => { places = lib; }).catch(() => { places = null; });
}
loadGoogle();

function closeList() { list.hidden = true; list.textContent = ""; items = []; active = -1; F.addr.setAttribute("aria-expanded", "false"); }

function render() {
  list.textContent = "";
  items.forEach((s, i) => {
    const li = document.createElement("li");
    li.setAttribute("role","option"); li.id = "opt" + i;
    li.setAttribute("aria-selected", i === active ? "true" : "false");
    const m = document.createElement("div"); m.className = "m"; m.textContent = s.main;
    const sub = document.createElement("div"); sub.className = "s"; sub.textContent = s.secondary;
    li.append(m, sub);
    li.addEventListener("pointerdown", e => { e.preventDefault(); pick(i); });
    list.append(li);
  });
  const foot = document.createElement("li"); foot.className = "foot"; foot.textContent = "Address suggestions by Google";
  list.append(foot);
  list.hidden = items.length === 0;
  F.addr.setAttribute("aria-expanded", items.length ? "true" : "false");
}

async function suggest(text) {
  const my = ++seq;
  if (!places || text.trim().length < 3) { closeList(); return; }
  try {
    if (!token) token = new places.AutocompleteSessionToken();
    const {suggestions} = await places.AutocompleteSuggestion.fetchAutocompleteSuggestions({
      input: text, sessionToken: token, includedRegionCodes: ["us"],
      includedPrimaryTypes: ["street_address", "premise", "subpremise"],
      locationBias: {center: {lat: CONFIG.BIAS.lat, lng: CONFIG.BIAS.lng}, radius: CONFIG.BIAS.radius}
    });
    if (my !== seq) return; // a newer keystroke won
    items = (suggestions || []).filter(s => s.placePrediction).slice(0, 6).map(s => ({
      p: s.placePrediction,
      main: s.placePrediction.mainText ? s.placePrediction.mainText.text : s.placePrediction.text.text,
      secondary: s.placePrediction.secondaryText ? s.placePrediction.secondaryText.text : ""
    }));
    active = -1; render();
  } catch (e) { if (my === seq) closeList(); }
}

async function pick(i) {
  const s = items[i]; if (!s) return;
  closeList();
  F.addr.value = s.main;
  try {
    const place = s.p.toPlace();
    await place.fetchFields({fields: ["addressComponents", "formattedAddress"]});
    token = null; // session ends with the details call
    const get = (type, short) => { const c = (place.addressComponents || []).find(c => c.types.includes(type)); return c ? (short ? c.shortText : c.longText) : ""; };
    const num = get("street_number"), route = get("route", true);
    if (num || route) F.addr.value = [num, route].filter(Boolean).join(" ");
    const unit = get("subpremise");
    if (unit && !F.unit.value) F.unit.value = unit;
    F.city.value = get("locality") || get("sublocality_level_1") || get("sublocality") || get("postal_town") || get("neighborhood") || get("administrative_area_level_3");
    F.state.value = get("administrative_area_level_1", true);
    F.zip.value = get("postal_code");
    placeId = place.id || null;
  } catch (e) { token = null; }
  [F.addr, F.city, F.state, F.zip].forEach(x => x.removeAttribute("aria-invalid"));
  F.unit.focus();
}

F.addr.addEventListener("input", () => {
  placeId = null;
  clearTimeout(timer);
  timer = setTimeout(() => suggest(F.addr.value), 160);
});
F.addr.addEventListener("keydown", e => {
  if (list.hidden) return;
  if (e.key === "ArrowDown") { active = Math.min(active + 1, items.length - 1); render(); e.preventDefault(); }
  else if (e.key === "ArrowUp") { active = Math.max(active - 1, 0); render(); e.preventDefault(); }
  else if (e.key === "Enter" && active >= 0) { pick(active); e.preventDefault(); }
  else if (e.key === "Escape") closeList();
});
F.addr.addEventListener("blur", () => setTimeout(closeList, 150));

/* ---------- Enter moves to next field ---------- */
const order = ["first","last","phone","email","addr","unit","zip","state","city"];
order.forEach((k, i) => F[k].addEventListener("keydown", e => {
  if (e.key !== "Enter" || (k === "addr" && !list.hidden && active >= 0)) return;
  e.preventDefault();
  if (i < order.length - 1) F[order[i+1]].focus(); else $("f").requestSubmit();
}));

/* ---------- item photo (staff) ---------- */
const item = $("item"), camFile = $("camFile"), thumb = $("thumb"), modal = $("modal"), prev = $("prev");
let photoBlob = null, pendingBlob = null, uploadedPath = null;
const openCamera = () => { camFile.value = ""; camFile.click(); };
$("camBtn").addEventListener("click", openCamera);
thumb.addEventListener("click", openCamera);
item.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); F.first.focus(); } });
async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image(); img.src = url; await img.decode();
    const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, "image/jpeg", 0.82));
  } finally { URL.revokeObjectURL(url); }
}
camFile.addEventListener("change", async () => {
  const f = camFile.files && camFile.files[0]; if (!f) return;
  try { pendingBlob = await shrink(f); } catch (x) { pendingBlob = null; }
  if (!pendingBlob) { errEl.textContent = "That photo couldn't be read. Please try again."; errEl.classList.remove("hide"); return; }
  if (prev.src) URL.revokeObjectURL(prev.src);
  prev.src = URL.createObjectURL(pendingBlob);
  modal.hidden = false;
});
$("retake").addEventListener("click", () => { modal.hidden = true; pendingBlob = null; openCamera(); });
$("usePhoto").addEventListener("click", () => {
  photoBlob = pendingBlob; pendingBlob = null; uploadedPath = null;
  if (thumb.src) URL.revokeObjectURL(thumb.src);
  thumb.src = URL.createObjectURL(photoBlob); thumb.hidden = false;
  $("camTxt").textContent = "Retake"; modal.hidden = true;
});
function clearPhoto() {
  photoBlob = pendingBlob = uploadedPath = null; modal.hidden = true;
  thumb.hidden = true; thumb.removeAttribute("src"); $("camTxt").textContent = "Photo"; item.value = "";
}
const uuid = () => {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16)); b[6] = b[6] & 15 | 64; b[8] = b[8] & 63 | 128;
  const h = [...b].map(x => x.toString(16).padStart(2, "0")).join("");
  return h.slice(0,8) + "-" + h.slice(8,12) + "-" + h.slice(12,16) + "-" + h.slice(16,20) + "-" + h.slice(20);
};
async function uploadPhoto() {
  if (!photoBlob) return null;
  if (uploadedPath) return uploadedPath; // already sent on an earlier try
  const path = new Date().toISOString().slice(0, 10) + "/" + uuid() + ".jpg";
  const r = await fetch(CONFIG.SUPABASE_URL + "/storage/v1/object/signup-photos/" + path, {
    method: "POST", headers: {"apikey": CONFIG.SUPABASE_KEY, "Content-Type": "image/jpeg"}, body: photoBlob
  });
  if (!r.ok) throw new Error("photo " + r.status);
  uploadedPath = path; return path;
}

/* ---------- validation + save ---------- */
function check() {
  Object.values(F).forEach(x => x.removeAttribute("aria-invalid"));
  if (!Object.values(F).some(x => x.value.trim()) && !item.value.trim() && !photoBlob) {
    hintEl.textContent = "Please fill in at least one field.";
    hintEl.classList.remove("hide"); F.first.focus(); return false;
  }
  hintEl.classList.add("hide"); return true;
}

const cap = s => s.trim().replace(/\s+/g, " ").replace(/(^|[\s'\-])\p{Ll}/gu, m => m.toUpperCase());

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  errEl.classList.add("hide");
  if (!check()) return;
  const em = F.email.value.trim().toLowerCase();
  const v = x => x.value.trim().replace(/\s+/g, " ") || null;
  const row = {
    first_name: v(F.first) && cap(F.first.value), last_name: v(F.last) && cap(F.last.value),
    phone: v(F.phone), email: em || null,
    address_line1: v(F.addr), address_line2: v(F.unit),
    city: v(F.city), state: v(F.state) && v(F.state).toUpperCase(), zip: v(F.zip),
    place_id: placeId, item_note: v(item)
  };
  go.disabled = true; go.textContent = "SAVING…";
  try {
    row.item_photo_path = await uploadPhoto();
    const r = await fetch(CONFIG.SUPABASE_URL + "/rest/v1/customer_signups", {
      method: "POST",
      headers: {"apikey": CONFIG.SUPABASE_KEY, "Content-Type": "application/json", "Prefer": "return=minimal"},
      body: JSON.stringify(row)
    });
    if (!r.ok) throw new Error(String(r.status));
    $("thanks").textContent = row.first_name ? "Thank you, " + row.first_name : "Thank you";
    $("formView").classList.add("hide"); $("doneView").classList.add("on");
    document.activeElement && document.activeElement.blur();
    setTimeout(reset, CONFIG.RESET_AFTER_SAVE_MS);
  } catch (x) {
    errEl.textContent = "We couldn't save just now. Please check the Wi-Fi and tap Save again.";
    errEl.classList.remove("hide");
  } finally { go.disabled = false; go.textContent = "SAVE MY DETAILS"; }
});

/* ---------- reset (after save, and after 2 idle minutes) ---------- */
function reset() {
  $("f").reset(); placeId = null; token = null; closeList(); clearPhoto();
  Object.values(F).forEach(x => x.removeAttribute("aria-invalid"));
  hintEl.classList.add("hide"); errEl.classList.add("hide");
  $("doneView").classList.remove("on"); $("formView").classList.remove("hide");
  window.scrollTo(0, 0);
}
let idle = 0;
const poke = () => { clearTimeout(idle); idle = setTimeout(() => { if (Object.values(F).some(x => x.value) || item.value || photoBlob) reset(); }, CONFIG.IDLE_RESET_MS); };
["pointerdown", "keydown", "input"].forEach(t => document.addEventListener(t, poke, {passive: true}));
}
</script>
</body>
