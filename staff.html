<style>
/* VOICE: quiet back-office ledger for TD staff
   IDEA: a jeweller's client card file, one card per customer with the item photo
   PICTURE: photo-led cards in a calm grid
   COLOUR/TYPE: white, ink, logo gold; Cormorant title, Jost body
   LAYOUT: PIN screen, then toolbar + card grid, stacks on phone */
:root{color-scheme:light;--bg:#fff;--ink:#141414;--mute:#6b6b6b;--line:#e2dfd2;--gold:#b3ab6a;--gold2:#8f8848;--err:#a3261b;--card:#fcfbf7}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Jost,system-ui,-apple-system,sans-serif;overflow-x:clip;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:1240px;margin:0 auto;padding:24px max(4vw,16px) 48px}
.brand{display:block;width:120px;margin:0 auto}
h1{font:600 clamp(30px,4vw,40px)/1.1 "Cormorant Garamond",Georgia,serif;text-align:center;margin:10px 0 4px}
.sub{text-align:center;color:var(--mute);margin:0 0 24px}
input,button{font:inherit}
input{font-size:17px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:48px;background:#fff;color:var(--ink);outline:none}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(179,171,106,.22)}
button{min-height:48px;border-radius:10px;padding:0 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:500;cursor:pointer}
button.ghost{background:#fff;color:var(--ink);border-color:var(--line)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#lock{max-width:340px;margin:8vh auto 0;display:grid;gap:12px}
#pin{text-align:center;font-size:28px;letter-spacing:.4em}
.err{color:var(--err);text-align:center;min-height:1.5em;margin:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
.bar .count{font-weight:500;margin-right:auto}
.bar input{flex:1 1 240px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px}
.card{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.ph{width:110px;height:110px;border-radius:10px;object-fit:cover;background:#efece0;cursor:zoom-in;border:0;padding:0}
.noph{width:110px;height:110px;border-radius:10px;background:#f3f1e8;color:var(--mute);display:grid;place-items:center;font-size:13px;text-align:center}
.nm{font-weight:500;font-size:18px;line-height:1.25}
.dt{font-size:13px;color:var(--mute)}
.it{display:inline-block;margin:4px 0 2px;font-size:14px;background:#f1eedc;color:#5e5a2c;border-radius:6px;padding:1px 8px}
.ln{font-size:15px;overflow-wrap:anywhere}
.ln a{color:var(--ink)}
.qb{font-size:12px;color:var(--mute);margin-top:4px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.view{position:fixed;inset:0;background:rgba(10,10,10,.94);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10;cursor:zoom-out}
.view[hidden]{display:none}
.view img{max-width:100%;max-height:100%;border-radius:10px}
.hide{display:none!important}
@media(max-width:420px){.card{grid-template-columns:84px minmax(0,1fr)}.ph,.noph{width:84px;height:84px}}
</style>
</head>

  <h1>Customer sign-ups</h1>
  <p class="sub">TD Diamonds staff only</p>

  <form id="lock" autocomplete="off">
    <input id="pin" type="password" inputmode="numeric" maxlength="12" placeholder="PIN" aria-label="PIN" autocomplete="off">
    <button id="open" type="submit">Open list</button>
    <p class="err" id="lockErr" role="alert"></p>
  </form>

  <section id="list" class="hide">
    <div class="bar">
      <span class="count" id="count"></span>
      <input id="q" type="search" placeholder="Search name, phone, item, city…" aria-label="Search">
      <button class="ghost" id="refresh" type="button">Refresh</button>
      <button class="ghost" id="csv" type="button">Download for Excel</button>
      <button class="ghost" id="logout" type="button">Lock</button>
    </div>
    <p class="err" id="listErr" role="alert"></p>
    <div class="grid" id="grid"></div>
    <p class="empty hide" id="empty">No sign-ups yet.</p>
  </section>
</main>
<div class="view" id="view" hidden><img id="big" alt="Item photo"></div>
<script>
{
const API = "https://oebqonzayfxfzvlvjgpv.supabase.co/functions/v1/signup-list";
const $ = id => document.getElementById(id);
let rows = [], pin = "";
try { pin = sessionStorage.getItem("tdpin") || ""; } catch (e) {}

const fmt = iso => new Date(iso).toLocaleString("en-US", {timeZone: "America/New_York", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit"});
const full = r => [r.first_name, r.last_name].filter(Boolean).join(" ");
const addr = r => [[r.address_line1, r.address_line2].filter(Boolean).join(", "), [r.city, [r.state, r.zip].filter(Boolean).join(" ")].filter(Boolean).join(", ")].filter(Boolean);

async function load() {
  const b = $("open"); b.disabled = true; b.textContent = "Opening…"; $("listErr").textContent = "";
  try {
    const r = await fetch(API, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({pin})});
    if (r.status === 401) throw new Error("Wrong PIN.");
    if (r.status === 429) throw new Error("Too many wrong PINs. Try again in an hour.");
    if (!r.ok) throw new Error("Couldn't load the list. Check the connection and try again.");
    rows = await r.json();
    try { sessionStorage.setItem("tdpin", pin); } catch (e) {}
    $("lock").classList.add("hide"); $("list").classList.remove("hide");
    render();
  } catch (e) {
    if ($("list").classList.contains("hide")) { $("lockErr").textContent = e.message; pin = ""; try { sessionStorage.removeItem("tdpin"); } catch (x) {} }
    else $("listErr").textContent = e.message;
  } finally { b.disabled = false; b.textContent = "Open list"; }
}

function render() {
  const q = $("q").value.trim().toLowerCase();
  const shown = rows.filter(r => !q || [full(r), r.phone, r.email, r.item_note, ...addr(r)].filter(Boolean).join(" ").toLowerCase().includes(q));
  $("count").textContent = shown.length === rows.length ? `${rows.length} sign-up${rows.length === 1 ? "" : "s"}` : `${shown.length} of ${rows.length}`;
  const g = $("grid"); g.textContent = "";
  $("empty").classList.toggle("hide", rows.length > 0);
  for (const r of shown) {
    const c = document.createElement("article"); c.className = "card";
    if (r.photo_url && r.photo_url.startsWith("https://")) {
      const im = document.createElement("img"); im.className = "ph"; im.src = r.photo_url; im.alt = "Item photo"; im.loading = "lazy";
      im.addEventListener("click", () => { $("big").src = r.photo_url; $("view").hidden = false; });
      c.append(im);
    } else { const n = document.createElement("div"); n.className = "noph"; n.textContent = "No photo"; c.append(n); }
    const d = document.createElement("div");
    const add = (cls, txt) => { if (txt == null) return null; const e = document.createElement("div"); e.className = cls; e.textContent = txt; d.append(e); return e; };
    add("nm", full(r) || "(no name)");
    add("dt", fmt(r.created_at));
    if (r.item_note) { const s = document.createElement("span"); s.className = "it"; s.textContent = "Item: " + r.item_note; d.append(s); }
    if (r.phone) { const e = add("ln", ""); const a = document.createElement("a"); a.href = "tel:" + r.phone.replace(/[^\d+]/g, ""); a.textContent = r.phone; e.append(a); }
    if (r.email) { const e = add("ln", ""); const a = document.createElement("a"); a.href = "mailto:" + r.email; a.textContent = r.email; e.append(a); }
    addr(r).forEach(l => add("ln", l));
    add("qb", r.qb_status === "synced" ? "In QuickBooks" : r.qb_status === "duplicate" ? "Already in QuickBooks" : "Not yet in QuickBooks");
    c.append(d); g.append(c);
  }
}

function csv() {
  const head = ["Date (New York)", "First name", "Last name", "Phone", "Email", "Street", "Apt/Suite", "City", "State", "ZIP", "Item", "Photo link (expires in 6 h)"];
  const esc = v => { v = v == null ? "" : String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [head, ...rows.map(r => [fmt(r.created_at), r.first_name, r.last_name, r.phone, r.email, r.address_line1, r.address_line2, r.city, r.state, r.zip, r.item_note, r.photo_url])].map(a => a.map(esc).join(","));
  const blob = new Blob(["﻿" + lines.join("\r\n")], {type: "text/csv;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "td-signups-" + new Date().toISOString().slice(0, 10) + ".csv";
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

$("lock").addEventListener("submit", e => { e.preventDefault(); pin = $("pin").value.trim(); if (pin) { $("lockErr").textContent = ""; load(); } });
$("q").addEventListener("input", render);
$("refresh").addEventListener("click", load);
$("csv").addEventListener("click", csv);
$("logout").addEventListener("click", () => { pin = ""; rows = []; try { sessionStorage.removeItem("tdpin"); } catch (e) {} $("grid").textContent = ""; $("pin").value = ""; $("list").classList.add("hide"); $("lock").classList.remove("hide"); });
$("view").addEventListener("click", () => { $("view").hidden = true; $("big").removeAttribute("src"); });
document.addEventListener("keydown", e => { if (e.key === "Escape") $("view").hidden = true; });
if (pin) load();
}
</script>
</body>
</html>
